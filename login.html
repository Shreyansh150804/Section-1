<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link
        href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic"
        rel="stylesheet" />

    <style>
        * {

            font-family: Roboto;
        }

        .form-title {
            background-color: black;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;

        }

        .card {
            border: 2px solid rgb(199, 48, 101);
            font-family: Arial, sans-serif;
            width: 20%;
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 3px 3px 5px 1px oklch(0% 0 0 / 0.441), -3px 3px 5px 1px rgba(0, 0, 0, 0.595), 3px -3px 5px 1px rgba(0, 0, 0, 0.533);
            ;

        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: antiquewhite;
            /* background-image: linear-gradient(0deg, white, antiquewhite, black);  */
            background-image:linear-gradient(0deg, rgba(12, 12, 12, 0.207),rgba(16, 15, 15, 0.13)),
            url(https://images.unsplash.com/photo-1497864149936-d3163f0c0f4b?q=80&w=1169&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);
            background-size: cover;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: rgb(196, 69, 15);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="card">

        <h2 class="form-title">Login Form </h2>
        <form>
            <label for="">Email Address</label>
            <input class="text-input" type="email">
            <br>
            <br>
            <label for="">Password</label>
            <input class="text-input" type="password">
            <br>
            <br>
            <a href="#" class="link forget-link">Forgot Password</a>
            <br>
            <br>
            <button class="btn-submit">Submit</button>
            <br>
            <br>
            <a href="#" class="link signup-link">
                Not Registered yet? Signup Now
            </a>
        </form>
    </div>


</body>

</html>
