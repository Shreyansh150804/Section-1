<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: rgb(16, 15, 94);
            font-family: Arial, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 500px;
            background: white;
            border: 3px solid black;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .form-title {
            background-color: black;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: rgb(16, 15, 94);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-submit:hover {
            background-color: rgb(30, 28, 150);
        }
    </style>
</head>

<body>

    <div class="card">
        <h2 class="form-title">Movie Ticket Booking Form</h2>

        <form>
            <label for="movie">Search for Movies</label>
            <input type="text" id="movie" list="movies"
                placeholder="Select a movie" required>

            <datalist id="movies">
                <option value="Dhurandhar 1">
                <option value="Obsession">
                <option value="Michael">
                <option value="Dhurandhar 2">
                <option value="Endgame">
            </datalist>

            <label for="date">Movie Booking Date</label>
            <input type="date" id="date" required>

            <label for="time">Available Time Slot</label>
            <select id="time" required>
                <option value="">Select Time</option>
                <option>9:30 AM</option>
                <option>2:40 PM</option>
                <option>9:30 PM</option>
            </select>

            <label for="tickets">Number of Tickets</label>
            <input type="number" id="tickets" min="1" max="10"
                placeholder="Enter number of tickets" required>

            <label for="email">Email</label>
            <input type="email" id="email"
                placeholder="Enter your email" required>

            <button type="submit" class="btn-submit">
                Book Now
            </button>
        </form>
    </div>

</body>

</html>
