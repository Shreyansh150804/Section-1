<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission form</title>
</head>
<body>
    <h1>Student  Admission Form </h1>
    <form >
    <label for="">Student Name </label>
    <input type="text" required minlength="2">
    
    <br>
    <br>

    <label for="">Student Email</label>
    <input type="email">
    
    <br>
    <br>
    <label for="">Date of birth</label>
    <input type="date">

    <br>
    <br>
    <label for="">Address</label>
    <textarea  cols="10" rows="4"></textarea>
    <br>
    <br>
     
    <label for="">Gender</label>
    <input type="radio"> Male
    <input type="radio"> Female
    <br>
    <br>
    <label for="">Select course</label>
    <select >
        <option >mern stack </option>
        <option >data science </option>
        <option >data analytics </option>
        
    </select>
    
    <br>
    <br>
    <label for="">select college </label>
    <input type="text" list="college">
    <datalist id="college">
        <option > Study hall</option>
        <option > npgc</option>
        <option > bbd</option>
        <option > lu</option>

    
    </datalist>
    <br>
    <br>
    <input type="checkbox" id="terms "
    <label for="terms">Accept  Terms & condition

    <Details>

        <summary>View terms and conditions</summary>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Alias natus, asperiores enim ratione sunt possimus. Nobis distinctio repellendus dolor labore!</p>
    </Details>
    <button>Submit</button>
    
     </form>
    
</body>
</html>
